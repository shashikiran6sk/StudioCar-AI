name: studiocar

# The local support plane, for APP_ENV=local and APP_ENV=development. Always
# run it through `scripts/local-compose.sh`, which reads APP_ENV and the rest of
# the repository-root .env.local.
#
#   pnpm infra:up   APP_ENV=local        (profile infra) everything except the
#                                        Next.js application, so `pnpm dev` can
#                                        run it natively with fast reloads.
#                   APP_ENV=development  (profile development) only the image
#                                        worker and the dispatcher. The
#                                        database, storage, and queue are the
#                                        real Development ones.
#   pnpm app:up     APP_ENV=local only   (profile app) the application too.
#
# Every dependency declares a health check and every dependant waits on it, so
# startup ordering is observed rather than slept through.
#
# The literal local values here must match packages/config/src/
# local-infrastructure.ts; a unit test keeps the two in step.

x-worker-environment: &worker-environment
  APP_ENV: ${APP_ENV:?Run the local stack through scripts/local-compose.sh}
  # The application's database, or the compose PostgreSQL when the settings
  # file names none (the Local default).
  DATABASE_URL: ${LOCAL_WORKER_DATABASE_URL:-postgresql://studiocar:studiocar@postgres:5432/studiocar}
  AWS_REGION: ap-south-1
  S3_BUCKET: studiocar-local
  S3_ENDPOINT: http://minio:9000
  S3_FORCE_PATH_STYLE: "true"
  S3_ACCESS_KEY_ID: studiocarlocal
  S3_SECRET_ACCESS_KEY: studiocarlocal123
  SQS_ENDPOINT: http://elasticmq:9324
  SQS_ACCESS_KEY_ID: studiocarlocal
  SQS_SECRET_ACCESS_KEY: studiocarlocal123
  SQS_IMAGE_QUEUE_URL: http://elasticmq:9324/000000000000/studiocar-images

services:
  postgres:
    image: postgres:17-alpine
    profiles: [infra, app]
    environment:
      POSTGRES_USER: studiocar
      POSTGRES_PASSWORD: studiocar
      POSTGRES_DB: studiocar
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studiocar -d studiocar"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Docker Hub's minio/minio repository is access gated; quay.io is not.
  minio:
    image: quay.io/minio/minio:latest
    profiles: [infra, app]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: studiocarlocal
      MINIO_ROOT_PASSWORD: studiocarlocal123
      # Browser uploads go straight to this endpoint, so the application origin
      # has to be allowed here just as it is on the deployed bucket.
      MINIO_API_CORS_ALLOW_ORIGIN: ${BROWSER_ORIGIN:-http://localhost:3000}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the private bucket and the browser CORS rule that direct uploads
  # need, then exits. Re-running is harmless.
  minio-init:
    image: quay.io/minio/mc:latest
    profiles: [infra, app]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/minio-init.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: studiocarlocal
      MINIO_ROOT_PASSWORD: studiocarlocal123
      S3_BUCKET: studiocar-local
      BROWSER_ORIGIN: http://localhost:3000
    volumes:
      - ./minio-init.sh:/scripts/minio-init.sh:ro

  # Local only. Development queues are AWS SQS.
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    profiles: [infra, app]
    ports:
      - "9324:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      # The image carries no HTTP client that treats an SQS error response as
      # success, so readiness is the queue port accepting connections.
      test: ["CMD-SHELL", "nc -z localhost 9324"]
      interval: 5s
      timeout: 5s
      retries: 20

  image-worker:
    profiles: [infra, app, development]
    image: studiocar-local-worker
    build:
      context: ../..
      dockerfile: infrastructure/local/Dockerfile.worker
    command: ["node", "workers/image-processing/dist/local.mjs"]
    environment:
      <<: *worker-environment
      # Storage follows .env.local, so the worker reads the same bucket the
      # browser uploaded to: MinIO under APP_ENV=local, the AWS Development
      # bucket under APP_ENV=development. `scripts/local-compose.sh` sets
      # these. `-` rather than `:-`, so a Development setting left empty (an
      # AWS endpoint) stays empty instead of becoming MinIO.
      AWS_REGION: ${LOCAL_WORKER_AWS_REGION-ap-south-1}
      S3_BUCKET: ${LOCAL_WORKER_S3_BUCKET-studiocar-local}
      S3_ENDPOINT: ${LOCAL_WORKER_S3_ENDPOINT-http://minio:9000}
      S3_FORCE_PATH_STYLE: ${LOCAL_WORKER_S3_FORCE_PATH_STYLE-true}
      S3_ACCESS_KEY_ID: ${LOCAL_WORKER_S3_ACCESS_KEY_ID-studiocarlocal}
      S3_SECRET_ACCESS_KEY: ${LOCAL_WORKER_S3_SECRET_ACCESS_KEY-studiocarlocal123}
      # The queue follows .env.local the same way: ElasticMQ under
      # APP_ENV=local, the AWS SQS Development queue under APP_ENV=development,
      # where an empty endpoint means AWS itself.
      SQS_ENDPOINT: ${LOCAL_WORKER_SQS_ENDPOINT-http://elasticmq:9324}
      SQS_ACCESS_KEY_ID: ${LOCAL_WORKER_SQS_ACCESS_KEY_ID-studiocarlocal}
      SQS_SECRET_ACCESS_KEY: ${LOCAL_WORKER_SQS_SECRET_ACCESS_KEY-studiocarlocal123}
      SQS_IMAGE_QUEUE_URL: ${LOCAL_WORKER_SQS_IMAGE_QUEUE_URL-http://elasticmq:9324/000000000000/studiocar-images}
      # Empty means "use the profile default", which is remove.bg.
      BACKGROUND_REMOVAL_PROVIDER: ${BACKGROUND_REMOVAL_PROVIDER:-}
      REMOVEBG_API_KEY: ${REMOVEBG_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      SELF_HOSTED_BIREFNET_ENDPOINT: ${SELF_HOSTED_BIREFNET_ENDPOINT:-}
      # Development may resolve AWS credentials from the standard environment
      # variables instead of an explicit S3 or SQS key pair. A shared ~/.aws profile
      # is not visible inside the container.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      # Local PostgreSQL, ElasticMQ, and MinIO exist only under APP_ENV=local;
      # Development uses its own database, AWS SQS, and AWS S3, so these are
      # waited on when present.
      postgres:
        condition: service_healthy
        required: false
      elasticmq:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false

  # Stands in for the production scheduler: the processing outbox is drained
  # by an HTTP endpoint, not by the queue, so something has to call it on a
  # cadence.
  dispatcher:
    image: curlimages/curl:latest
    profiles: [infra, app, development]
    environment:
      DISPATCH_TARGET_URL: ${DISPATCH_TARGET_URL:-http://host.docker.internal:3000}
      PROCESSING_DISPATCH_TOKEN: ${PROCESSING_DISPATCH_TOKEN:-local-processing-dispatch-token-000000}
      DISPATCH_INTERVAL_SECONDS: ${DISPATCH_INTERVAL_SECONDS:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "/scripts/dispatch-ticker.sh"]
    volumes:
      - ./dispatch-ticker.sh:/scripts/dispatch-ticker.sh:ro

  web:
    profiles: [app]
    build:
      context: ../..
      dockerfile: infrastructure/local/Dockerfile.web
    command: ["pnpm", "--filter", "@studiocar/web", "dev", "--hostname", "0.0.0.0"]
    environment:
      <<: *worker-environment
      NODE_ENV: development
      # Everything not named here comes from the Local profile: fake Google
      # and phone sign-in, the local session secret and tokens. An
      # empty value means "use the profile default".
      GOOGLE_AUTH_DRIVER: ${GOOGLE_AUTH_DRIVER:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PHONE_OTP_DRIVER: ${PHONE_OTP_DRIVER:-}
      PHONE_OTP_DEV_CODE: ${PHONE_OTP_DEV_CODE:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_WIDGET_ID: ${MSG91_WIDGET_ID:-}
      MSG91_WIDGET_TOKEN: ${MSG91_WIDGET_TOKEN:-}
      BACKGROUND_REMOVAL_PROVIDER: ${BACKGROUND_REMOVAL_PROVIDER:-}
      PROCESSING_DISPATCH_TOKEN: ${PROCESSING_DISPATCH_TOKEN:-}
      LIFECYCLE_CLEANUP_TOKEN: ${LIFECYCLE_CLEANUP_TOKEN:-}
      STORAGE_CLEANUP_TOKEN: ${STORAGE_CLEANUP_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      elasticmq:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
