# SQS-compatible local queue. `host = "*"` makes ElasticMQ echo the request
# host back in generated queue URLs, so the queue resolves whether it is
# reached from the host machine or from inside the compose network.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  studiocar-images {
    defaultVisibilityTimeout = 180 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "studiocar-images-dlq"
      maxReceiveCount = 5
    }
  }
  studiocar-images-dlq { }
}
