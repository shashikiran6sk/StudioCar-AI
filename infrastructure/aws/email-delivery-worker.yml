AWSTemplateFormatVersion: "2010-09-09"
Description: StudioCar AI bounded email-delivery Lambda worker and SQS event source

Parameters:
  ArtifactBucket:
    Type: String
    Description: Private S3 bucket containing the reviewed worker deployment archive
  ArtifactKey:
    Type: String
    Description: Immutable S3 key for the reviewed worker deployment archive
  DatabaseSecretArn:
    Type: String
    Description: Secrets Manager ARN containing DATABASE_URL as a JSON property
  ResendSecretArn:
    Type: String
    Description: Secrets Manager ARN containing RESEND_API_KEY as a JSON property
  EmailFrom:
    Type: String
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    Description: Verified sender email address
  ApplicationBaseUrl:
    Type: String
    AllowedPattern: ^https://.+$
    Description: Public HTTPS origin used for authorized portfolio links
  EmailDeliveryQueueArn:
    Type: String
    Description: ARN exported by the email-delivery queue stack
  MaximumConcurrency:
    Type: Number
    Default: 5
    MinValue: 2
    MaxValue: 100
  MemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
  TimeoutSeconds:
    Type: Number
    Default: 30
    MinValue: 5
    MaxValue: 60

Resources:
  EmailDeliveryWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: email-delivery-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteStructuredLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
              - Sid: ConsumeEmailQueue
                Effect: Allow
                Action:
                  - sqs:ChangeMessageVisibility
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ReceiveMessage
                Resource: !Ref EmailDeliveryQueueArn

  EmailDeliveryWorker:
    Type: AWS::Lambda::Function
    Properties:
      Architectures:
        - arm64
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Description: Delivers StudioCar transactional email messages
      Environment:
        Variables:
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: "1"
          APPLICATION_BASE_URL: !Ref ApplicationBaseUrl
          DATABASE_URL: !Sub '{{resolve:secretsmanager:${DatabaseSecretArn}:SecretString:DATABASE_URL}}'
          EMAIL_DELIVERY_CLAIM_TTL_MS: "45000"
          EMAIL_FROM: !Ref EmailFrom
          RESEND_API_KEY: !Sub '{{resolve:secretsmanager:${ResendSecretArn}:SecretString:RESEND_API_KEY}}'
          RESEND_TIMEOUT_MS: "8000"
      Handler: handler.handler
      MemorySize: !Ref MemorySize
      ReservedConcurrentExecutions: !Ref MaximumConcurrency
      Role: !GetAtt EmailDeliveryWorkerRole.Arn
      Runtime: nodejs24.x
      Timeout: !Ref TimeoutSeconds

  EmailDeliveryEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 10
      Enabled: true
      EventSourceArn: !Ref EmailDeliveryQueueArn
      FunctionName: !Ref EmailDeliveryWorker
      FunctionResponseTypes:
        - ReportBatchItemFailures
      ScalingConfig:
        MaximumConcurrency: !Ref MaximumConcurrency

  EmailDeliveryWorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Email-delivery Lambda has invocation errors
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref EmailDeliveryWorker
      EvaluationPeriods: 1
      MetricName: Errors
      Namespace: AWS/Lambda
      Period: 60
      Statistic: Sum
      Threshold: 0
      TreatMissingData: notBreaching

Outputs:
  EmailDeliveryWorkerArn:
    Value: !GetAtt EmailDeliveryWorker.Arn
  EmailDeliveryWorkerRoleArn:
    Value: !GetAtt EmailDeliveryWorkerRole.Arn
